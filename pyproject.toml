[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ncm-codec"
version = "0.1.0"
authors = [
  { name="corpcol" },
]
description = "NCM: Lossless Neural Codec for Code Context Compression"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.20.0",
    "transformers>=4.30.0",
]

[project.scripts]
ncm = "ncm.cli:main"
