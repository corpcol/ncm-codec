[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ncm-codec"
version = "0.2.0"
authors = [
  { name="corpcol" },
]
description = "NCM: Lossless Neural Codec & Generative KV-Cache Context Compression for Code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.20.0",
    "transformers>=4.30.0",
]

[project.scripts]
ncm = "ncm.cli:main"

[tool.setuptools.packages.find]
include = ["ncm*"]
